<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Vocab Room</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #ef4444;
      --accent-success: #22c55e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #f1f5f9;
      margin-bottom: 0.2rem;
    }

    .setup-panel, .game-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .row {
      display: flex;
      gap: 0.8rem;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    select, input {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background-color: #0369a1; }
    button:active { transform: scale(0.98); }

    .room-visual {
      background: linear-gradient(to bottom, #111827, #1f2937);
      height: 160px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
    }

    .hero {
      font-size: 2.5rem;
      transition: transform 0.3s;
      z-index: 2;
    }

    .monster {
      font-size: 2.5rem;
      position: absolute;
      right: 20px;
      transition: right 0.5s linear;
      z-index: 2;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-sub);
      background: #0f172a;
      padding: 0.6rem 1rem;
      border-radius: 8px;
    }

    .sentence-box {
      font-size: 1.15rem;
      line-height: 1.5;
      background: #0f172a;
      padding: 1.2rem;
      border-radius: 10px;
      border-left: 4px solid #38bdf8;
    }

    .feedback-box {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .feedback-box.success { border-left: 4px solid var(--accent-success); color: #86efac; }
    .feedback-box.error { border-left: 4px solid var(--accent-color); color: #fca5a5; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Escape the Room</h1>
      <p style="color: var(--text-sub)">English Grammar & Vocabulary Survival</p>
    </header>

    <!-- Панель налаштування / Ключ та теми -->
    <div class="setup-panel" id="setupPanel">
      <div class="col">
        <label>Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your free Gemini API key...">
      </div>
      <div class="row">
        <div class="col">
data-theme        <label>Theme</label>
          <select id="themeSelect">
            <option value="Culture & Art">Culture & Art</option>
            <option value="Politics & Society">Politics & Society</option>
            <option value="Geography & Nature">Geography & Nature</option>
            <option value="Business & Tech">Business & Tech</option>
            <option value="Daily Life & Psychology">Daily Life & Psychology</option>
          </select>
        </div>
        <div class="col">
          <label>Grammar Level</label>
          <select id="levelSelect">
            <option value="Intermediate (Mixed Tenses)">Intermediate (Mixed Tenses)</option>
            <option value="Advanced (Complex Structures & Passive)">Advanced (Complex & Passive)</option>
            <option value="Business / Formal">Business / Formal</option>
          </select>
        </div>
      </div>
      <button id="startBtn">Start Game</button>
    </div>

    <!-- Ігрова панель -->
    <div class="game-panel hidden" id="gamePanel">
      <div class="stats-bar">
        <span id="roomCounter">Room: 1</span>
        <span id="scoreCounter">Escaped: 0</span>
      </div>

      <div class="room-visual">
        <div class="hero" id="heroEmoji">🧍‍♂️</div>
        <div style="font-size: 2rem; color: #475569;">🚪 Locked Door</div>
        <div class="monster" id="monsterEmoji">👾</div>
      </div>

      <div class="sentence-box" id="sentenceText">Loading next challenge...</div>

      <div class="row" id="inputRow">
        <input type="text" id="answerInput" placeholder="Type the missing word...">
        <button id="submitBtn">Submit</button>
      </div>

      <div class="feedback-box" id="feedbackBox"></div>
      
      <button id="nextRoomBtn" class="hidden">Next Room ➔</button>
    </div>
  </div>

  <script>
    const setupPanel = document.getElementById('setupPanel');
    const gamePanel = document.getElementById('gamePanel');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const themeSelect = document.getElementById('themeSelect');
    const levelSelect = document.getElementById('levelSelect');
    const startBtn = document.getElementById('startBtn');

    const roomCounter = document.getElementById('roomCounter');
    const scoreCounter = document.getElementById('scoreCounter');
    const sentenceText = document.getElementById('sentenceText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackBox = document.getElementById('feedbackBox');
    const nextRoomBtn = document.getElementById('nextRoomBtn');
    const monsterEmoji = document.getElementById('monsterEmoji');

    let currentRoom = 1;
    let score = 0;
    let currentData = null;
    let monsterPosition = 80; // відсотки справа

    // Зберігаємо ключ у пам'яті
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    startBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('Please enter your Gemini API key.');
      localStorage.setItem('gemini_api_key', key);

      setupPanel.classList.add('hidden');
      gamePanel.classList.remove('hidden');
      loadNewRoom();
    });

    async function loadNewRoom() {
      answerInput.value = '';
      answerInput.disabled = false;
      submitBtn.classList.remove('hidden');
      feedbackBox.classList.add('hidden');
      nextRoomBtn.classList.add('hidden');
      monsterPosition = 80;
      monsterEmoji.style.right = monsterPosition + 'px';
      roomCounter.textContent = `Room: ${currentRoom}`;

      sentenceText.textContent = 'Generating next chamber challenge...';

      const apiKey = apiKeyInput.value.trim();
      const theme = themeSelect.value;
      const level = levelSelect.value;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
      
      const prompt = `Act as an English survival game engine. Generate a sentence with ONE missing word (represented by blanks like "_____") based on the theme "${theme}" and grammar level "${level}".
Return ONLY a raw JSON object (no markdown backticks) with exact keys:
- "sentence": "The sentence with _____ for the missing word."
- "missingWord": "the exact missing word in base form or correct tense"
- "explanation": "A short, clear explanation in Ukrainian why this word/form is correct and what it means."`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        if (!response.ok) throw new Error('API Error or Quota limit reached.');

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        
        currentData = JSON.parse(rawText);
        sentenceText.textContent = currentData.sentence;
      } catch (err) {
        sentenceText.textContent = 'Error loading challenge. Check API key or quota.';
        console.error(err);
      }
    }

    function checkAnswer() {
      if (!currentData) return;
      const userAns = answerInput.value.trim().toLowerCase();
      const correctAns = currentData.missingWord.toLowerCase();

      answerInput.disabled = true;
      submitBtn.classList.add('hidden');
      feedbackBox.classList.remove('hidden');

      if (userAns === correctAns) {
        score++;
        scoreCounter.textContent = `Escaped: ${score}`;
        feedbackBox.className = 'feedback-box success';
        feedbackBox.innerHTML = `<strong>🎉 Correct! Door unlocked!</strong><br>${currentData.explanation}`;
        monsterEmoji.style.right = '-50px'; // монстер відступає
        nextRoomBtn.classList.remove('hidden');
      } else {
        feedbackBox.className = 'feedback-box error';
        feedbackBox.innerHTML = `<strong>💀 Caught by the monster!</strong><br>Correct word was: <b>${currentData.missingWord}</b><br>${currentData.explanation}`;
        monsterEmoji.style.right = '20px'; // монстр нападає
        // Можна додати перезапуск або кнопку спроби знову
        setTimeout(() => {
          currentRoom = 1;
          score = 0;
          setupPanel.classList.remove('hidden');
          gamePanel.classList.add('hidden');
        }, 6000);
      }
    }

    submitBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    nextRoomBtn.addEventListener('click', () => {
      currentRoom++;
      loadNewRoom();
    });
  </script>
</body>
</html>
